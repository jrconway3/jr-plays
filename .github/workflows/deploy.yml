name: Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

# Prevent concurrent deploys — only the latest run proceeds, cancelling any in-progress one.
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
  THEME_DIR: wp-content/themes/jr-plays-theme

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────────
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      # ── 2. Build theme assets ─────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ env.THEME_DIR }}/package-lock.json

      - name: Build theme assets
        working-directory: ${{ env.THEME_DIR }}
        run: npm ci && npm run build:assets

      # ── 3. SSH key ────────────────────────────────────────────────────────────
      - name: Install SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ── 4. Pull code on server ────────────────────────────────────────────────
      - name: Pull & update server
        env:
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_REF: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -euo pipefail
             cd \"$REMOTE_DIR\"
             git fetch origin production
             git fetch origin \"$DEPLOY_REF\"
             git reset --hard $DEPLOY_SHA
             git submodule update --init --recursive
             composer install --no-dev --optimize-autoloader --no-interaction"

      # ── 5. Sync built assets ──────────────────────────────────────────────────
      - name: Sync built theme assets
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" \
            "$THEME_DIR/assets/dist/" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_DIR }}/$THEME_DIR/assets/dist/"
