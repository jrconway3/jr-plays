name: jr-local

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html
      WP_DB_NAME: ${WP_DB_NAME}
      WP_DB_USER: ${WP_DB_USER}
      WP_DB_PASSWORD: ${WP_DB_PASSWORD}
      WP_DB_HOST: ${WP_DB_HOST:-db}
      WP_DB_PORT: ${WP_DB_PORT:-3306}
      WP_DB_PREFIX: ${WP_DB_PREFIX:-wp_}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html

  db:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: ${WP_DB_NAME:-jr_local}
      MYSQL_USER: ${WP_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WP_DB_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - jr_local_db:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  jr_local_db:
